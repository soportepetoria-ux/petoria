workflows:
  petoria-ios:
    name: Petoria iOS
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      node: latest
      xcode: latest
      cocoapods: default

    scripts:
      - name: Instalar dependencias
        script: |
          npm install

      - name: Crear proyecto iOS
        script: |
          npx cap add ios

      - name: Sincronizar Petoria con iOS
        script: |
          npx cap sync ios

      - name: Instalar CocoaPods
        script: |
          cd ios/App
          pod install

      - name: Compilar para simulador iPhone
        script: |
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

    artifacts:
      - ios/App/build/Build/Products/Debug-iphonesimulator/*.app
